[project]
name = "flauschi_pipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "assemblyai>=1.3.0",
    "boto3>=1.43.89",
    "dagster==1.13.21",
    "dagster-aws>=0.29.21",
    "feedparser>=6.0.14",
    "tiktoken>=0.14.0",
    "transformers>=5.17.0",
    "types-boto3-lite[s3]>=1.43.89",
    "universal-pathlib>=0.3.10",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "flauschi_pipeline"
registry_modules = [
    "flauschi_pipeline.components.*",
]


